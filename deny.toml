# cargo-deny configuration — supply-chain checks for the Rust workspace.
# Run locally: `cargo deny check` (CI runs advisories + licenses + bans).

[advisories]
yarn-audit-without-vulnerability-audit = false
ignore = [
    # Add RUSTSEC IDs here only with a written justification and a review
    # date; never silence an advisory that touches the funds-movement paths.
]

[licenses]
license = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0"]
private = { ignore = false }
unregistered = { ignore = false }
allow = [
    # 0BSD and CC0-1.0 occasionally show up in transitive deps.
    "0BSD",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[[licenses.clarify]]
name = "streampay-contract"
expression = "Apache-2.0"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
