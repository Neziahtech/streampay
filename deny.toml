# cargo-deny configuration — supply-chain checks for the Rust workspace.
# Run locally: `cargo deny check` (CI runs advisories + licenses + bans + sources).

[advisories]
ignore = [
    # RUSTSEC-2024-0436 (`paste`, "unmaintained"): build-time-only macro
    # crate, pulled transitively by soroban-env-common; archived by its
    # author but stable, and no fixed version exists. Not in the runtime
    # funds path. Re-review by 2027-04 or when soroban-sdk drops it.
    "RUSTSEC-2024-0436",
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
