[package]
name = "streampay-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
streampay-contract = { path = "../contracts/streaming-payments" }
streampay-model = { path = "../model", features = ["arbitrary"] }

[[bin]]
name = "streamed_at"
path = "fuzz_targets/streamed_at.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dispute_bond"
path = "fuzz_targets/dispute_bond.rs"
name = "differential"
path = "fuzz_targets/differential.rs"
test = false
doc = false
bench = false
