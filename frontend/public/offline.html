<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — StreamPay</title>
    <style>
      :root {
        --bg: #0a0e16;
        --panel: #111725;
        --line: #22304a;
        --text: #e8eefb;
        --muted: #93a1b8;
        --accent: #8b7cff;
        --accent2: #39c5ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        max-width: 480px;
        width: 100%;
        padding: 32px 28px;
        text-align: center;
      }
      .icon {
        font-size: 48px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 12px;
        background: linear-gradient(90deg, #c9c2ff, #7ce7ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        color: var(--muted);
        margin: 0 0 24px;
        font-size: 14px;
      }
      .btn {
        display: inline-block;
        background: var(--accent);
        color: #fff;
        padding: 10px 20px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        border: none;
        cursor: pointer;
      }
      .btn:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <div class="icon" aria-hidden="true">⚡</div>
      <h1>Offline Mode</h1>
      <p>
        You are currently disconnected from the internet. Cached stream views and
        accrual calculations remain accessible locally. Signed transactions will be
        stored in your pending queue for submission once connection returns.
      </p>
      <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    </main>
  </body>
</html>
