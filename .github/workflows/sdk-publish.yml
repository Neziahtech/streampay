name: Publish SDKs

# Tag-driven release of the three clients. A tag must look like `sdk-v0.3.0`
# and match the versions in sdks/rust/Cargo.toml, sdks/typescript/package.json,
# and sdks/python/pyproject.toml.
#
# Secrets (repository or environment):
#   CARGO_REGISTRY_TOKEN  crates.io token with publish-new + publish-update
#   NPM_TOKEN             npm automation token for the @streampay scope
#   TEST_PYPI_API_TOKEN   TestPyPI token (test-publish demonstration)
#   PYPI_API_TOKEN        PyPI token (production, protected environment)
#
# The workflow_dispatch path publishes only to TestPyPI, which is the
# documented way to exercise the pipeline without touching production.

on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: "Publish the built wheel/sdist to TestPyPI"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance + PyPI trusted publishing

jobs:
  version-check:
    name: Tag matches package versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify versions
        run: |
          python3 - <<'PY'
          import json, os, re, sys, tomllib
          ref = os.environ.get("GITHUB_REF_NAME", "")
          versions = {
              "rust": tomllib.load(open("sdks/rust/Cargo.toml", "rb"))["package"]["version"],
              "npm": json.load(open("sdks/typescript/package.json"))["version"],
              "pypi": tomllib.load(open("sdks/python/pyproject.toml", "rb"))["project"]["version"],
          }
          if set(versions.values()) != {list(versions.values())[0]}:
              sys.exit(f"SDK versions disagree: {versions}")
          if ref.startswith("sdk-v"):
              tag = ref[len("sdk-v"):]
              if tag != versions["rust"]:
                  sys.exit(f"tag {ref} does not match package version {versions['rust']}")
          print("versions:", versions)
          PY

  crates:
    name: crates.io
    needs: version-check
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish streampay-sdk
        working-directory: sdks/rust
        run: cargo publish --locked --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

  npm:
    name: npm
    needs: version-check
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - working-directory: sdks/typescript
        run: npm ci
      - working-directory: sdks/typescript
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  testpypi:
    name: TestPyPI (test-publish)
    needs: version-check
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/sdk-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - working-directory: sdks/python
        run: python -m build
      - name: Publish to TestPyPI
        if: github.event_name == 'push' || inputs.publish_testpypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          # TestPyPI is allowed to reject re-uploads of an existing version.
          skip-existing: true

  pypi:
    name: PyPI
    needs: [version-check, testpypi]
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - working-directory: sdks/python
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist
          password: ${{ secrets.PYPI_API_TOKEN }}
