name: Wasm Diff PR Comment

on:
  workflow_run:
    workflows: ["Wasm Function Diff"]
    types:
      - completed

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  post-comment:
    name: Post PR Comment
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download Diff Artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-diff-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts

      - name: Post or Update PR Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            // 1. Identify PR number
            let prNumber = null;
            const prNumberFile = 'artifacts/pr_number';
            if (fs.existsSync(prNumberFile)) {
              const content = fs.readFileSync(prNumberFile, 'utf8').trim();
              if (content && !isNaN(parseInt(content, 10))) {
                prNumber = parseInt(content, 10);
              }
            }

            if (!prNumber && context.payload.workflow_run.pull_requests && context.payload.workflow_run.pull_requests.length > 0) {
              prNumber = context.payload.workflow_run.pull_requests[0].number;
            }

            if (!prNumber) {
              core.warning('No PR number found for workflow run. Skipping PR comment.');
              return;
            }

            // 2. Read diff report
            const reportPath = 'artifacts/wasm_diff_report.md';
            if (!fs.existsSync(reportPath)) {
              core.warning(`Report file ${reportPath} not found`);
              return;
            }
            const reportBody = fs.readFileSync(reportPath, 'utf8');
            const botMarker = '<!-- wasm-diff-report -->';

            // 3. Post or update comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existingComment = comments.find(c => c.body && c.body.includes(botMarker));
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: reportBody,
              });
              console.log(`Updated existing PR comment ID: ${existingComment.id} on PR #${prNumber}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: reportBody,
              });
              console.log(`Created new PR comment on PR #${prNumber}`);
            }
