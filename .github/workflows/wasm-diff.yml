name: Wasm Function Diff

on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/wasm-diff.yml'
      - '.github/workflows/wasm-diff-comment.yml'
      - '.github/actions/**'
      - '.github/scripts/**'
      - 'scripts/wasm-report.mjs'
  workflow_dispatch:

concurrency:
  group: wasm-diff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# ==============================================================================
# WASM ANALYSIS TOOL CHOICE & JUSTIFICATION:
#
# We use `scripts/wasm-report.mjs --json` directly to inspect base and head Wasm
# contract binaries with zero external dependencies.
#
# Why `wasm-report.mjs`:
# 1. Byte-level granularity: `wasm-report.mjs` parses the Wasm binary format directly,
#    extracting exact function body byte sizes from the Code section and mapping
#    exported entrypoint names from the Export section.
# 2. Zero unverified external dependencies: Eliminates unverified curl downloads
#    for wabt, binaryen, or third-party disassemblers.
# 3. Churn Normalization:
#    Downstream functions often experience offset and index shifts when upstream
#    routines are added or removed, despite having identical sizes.
#    Our diff action matches exported entrypoint names and normalizes shifted
#    function indices (0 B delta) as filtered churn to eliminate review fatigue.
# ==============================================================================

jobs:
  wasm-diff:
    name: Function-level Wasm binary diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Head (PR)
        uses: actions/checkout@v7
        with:
          path: head-repo

      - name: Checkout Base Branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref || 'main' }}
          path: base-repo

      - name: Run Wasm Diff Unit Tests
        run: |
          python3 -m unittest discover -s head-repo/.github/scripts -p "test_*.py"

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            head-repo/target
            base-repo/target
          key: ${{ runner.os }}-wasm-diff-${{ hashFiles('head-repo/Cargo.lock', 'base-repo/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-diff-

      - name: Create artifacts directory
        run: mkdir -p artifacts/base artifacts/head

      - name: Build Base Wasm
        working-directory: base-repo
        run: |
          if command -v stellar >/dev/null 2>&1; then
            (cd contracts/streaming-payments && stellar contract build)
          else
            SOROBAN_SDK_BUILD_SYSTEM_SUPPORTS_SPEC_SHAKING_V2=1 cargo build --target wasm32v1-none --release -p streampay-contract
          fi
          if [ -f target/wasm32v1-none/release/streampay_contract.wasm ]; then
            cp target/wasm32v1-none/release/streampay_contract.wasm ../artifacts/base/streampay_contract.wasm
          else
            cp contracts/streaming-payments/../../target/wasm32v1-none/release/streampay_contract.wasm ../artifacts/base/streampay_contract.wasm
          fi
          sha256sum ../artifacts/base/streampay_contract.wasm

      - name: Build Head Wasm
        working-directory: head-repo
        run: |
          if command -v stellar >/dev/null 2>&1; then
            (cd contracts/streaming-payments && stellar contract build)
          else
            SOROBAN_SDK_BUILD_SYSTEM_SUPPORTS_SPEC_SHAKING_V2=1 cargo build --target wasm32v1-none --release -p streampay-contract
          fi
          if [ -f target/wasm32v1-none/release/streampay_contract.wasm ]; then
            cp target/wasm32v1-none/release/streampay_contract.wasm ../artifacts/head/streampay_contract.wasm
          else
            cp contracts/streaming-payments/../../target/wasm32v1-none/release/streampay_contract.wasm ../artifacts/head/streampay_contract.wasm
          fi
          sha256sum ../artifacts/head/streampay_contract.wasm

      # Invoke the composite action: .github/actions/wasm-diff
      - name: Run Wasm Function Diff Action
        id: diff
        uses: ./head-repo/.github/actions/wasm-diff
        with:
          base_wasm: artifacts/base/streampay_contract.wasm
          head_wasm: artifacts/head/streampay_contract.wasm
          output_dir: artifacts
          max_delta: 1024

      - name: Display Report in CI Summary
        if: always()
        run: |
          [ -f artifacts/wasm_diff_report.md ] && cat artifacts/wasm_diff_report.md >> $GITHUB_STEP_SUMMARY

      - name: Record PR Number
        if: always() && github.event_name == 'pull_request'
        run: echo "${{ github.event.pull_request.number }}" > artifacts/pr_number

      - name: Enforce Wasm Size Budget
        shell: bash
        env:
          TOTAL_DELTA: ${{ steps.diff.outputs.total_delta }}
          MAX_DELTA: 1024
        run: |
          echo "Total Wasm byte delta: $TOTAL_DELTA B (budget: $MAX_DELTA B)"
          if [ -n "$TOTAL_DELTA" ] && [ "$TOTAL_DELTA" -gt "$MAX_DELTA" ]; then
            echo "::error::Wasm binary grew by $TOTAL_DELTA bytes, exceeding the allowed threshold of $MAX_DELTA bytes."
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wasm-diff-results
          path: artifacts/
