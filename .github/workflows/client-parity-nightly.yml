name: Nightly Client Parity

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-fixture-matrix:
    name: Full client fixture matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          components: rustfmt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Contract testutils parity run
        run: cargo test -p streampay-contract --locked client_parity_test::shared_client_parity_fixtures_match_event_xdr_and_balances

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install CLI dependencies
        working-directory: tools/streampay-cli
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Frontend parity run
        working-directory: frontend
        run: npm run test:parity

      - name: CLI parity run
        working-directory: tools/streampay-cli
        run: npm test

      - name: Archive shared parity fixtures
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        uses: actions/upload-artifact@v7
        with:
          name: client-parity-fixtures-${{ github.run_id }}
          path: tests/client-parity/fixtures.json
          if-no-files-found: error
