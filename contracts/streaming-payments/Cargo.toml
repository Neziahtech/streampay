[package]
name = "streampay-contract"
version = "0.1.0"
edition = "2021"
description = "StreamPay: continuous, linear streaming payments (payroll, vesting, subscriptions) for the Stellar network, built on Soroban."
license = "Apache-2.0"
keywords = ["stellar", "soroban", "payments", "streaming", "smart-contract"]
categories = ["cryptography::cryptocurrencies"]

[lib]
# `cdylib` for the Wasm build; `rlib` so the fuzz crate (and downstream
# Rust consumers) can link the pure rate math natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk.workspace = true

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
# Enables the schema-fingerprint generator (and its spec / storage probes)
# for host builds only. Never enabled for the release Wasm build, so none of
# the diagnostic code below ends up on-chain.
schema-fingerprint = ["soroban-sdk/testutils"]

[[example]]
name = "schema_fingerprint"
required-features = ["schema-fingerprint"]

