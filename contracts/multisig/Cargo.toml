[package]
name = "streampay-multisig"
version = "0.1.0"
edition = "2021"
description = "Reference K-of-N multisig contract with propose/approve/execute lifecycle for Soroban account abstraction and streaming payments."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk.workspace = true

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
streampay-contract = { path = "../streaming-payments" }
